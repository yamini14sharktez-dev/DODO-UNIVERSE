name: Analyze

on:
  push:
    branches: [main, setup, 'feature/**']
  pull_request:
    branches: [main, setup]

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dodo_universe_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos
