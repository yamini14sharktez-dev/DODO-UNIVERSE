name: Tests

on:
  push:
    branches: [main, setup, 'feature/**']
  pull_request:
    branches: [main, setup]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dodo_universe_flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test
